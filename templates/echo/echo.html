<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Echo - {{ method }}</title>
</head>
<body>
    <h1>Method: {{ method }}</h1>
    {% if name1 %}
        <p>Name1: {{ name1 }}</p>
    {% endif %}
    {% if name2 %}
        <p>Name2: {{ name2 }}</p>
    {% endif %}
    {% if dob %}
        <p>DOB: {{ dob }}</p>
    {% endif %}
</body>
</html>
